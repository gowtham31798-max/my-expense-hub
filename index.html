  const p = new URLSearchParams({ action: 'TEMPLATE', text: `Pay ${cardTitle(card)} credit card bill`, dates: `${ymd(start)}/${ymd(end)}`,
    details: `Bill is generated on the ${ordinal(card.statementDay)}. Check the amount in Family Spend Hub: ${appUrl()}`, recur: `RRULE:${rruleFor(card.dueDay)}` });
  return `https://calendar.google.com/calendar/render?${p.toString()}`;
}

/* in-app bill notifications (once per day per card) */
function checkCardReminders() {
  if (!S.cards.length || !('Notification' in window) || Notification.permission !== 'granted') return;
  let log; try { log = JSON.parse(localStorage.getItem('fsh_cardNotified') || '{}'); } catch { log = {}; }
  const today = localISO(new Date());
  for (const c of S.cards.filter(x => x.remind)) {
    const cy = cardCycle(c);
    const stKey = `st_${c.id}_${cy.key}`, dueKey = `due_${c.id}_${today}`;
    if (cy.isStatementDay && !log[stKey]) {
      log[stKey] = 1;
      notify(`${c.name}: bill generated`, `${inr(cy.billed)} logged this cycle. Due on ${fmtDay(cy.due)}.`).catch(() => {});
    } else if (!cy.paid && cy.billed > 0 && cy.daysLeft <= (c.remindDays ?? 3) && cy.daysLeft >= -5 && !log[dueKey]) {
      log[dueKey] = 1;
      notify(`${c.name}: ${cy.status.toLowerCase()}`, `Bill ${inr(cy.billed)} · due ${fmtDay(cy.due)}. Tap to open and mark it paid.`).catch(() => {});
    }
  }
  for (const k of Object.keys(log)) if (!k.includes(today) && !k.startsWith('st_')) delete log[k];
  localStorage.setItem('fsh_cardNotified', JSON.stringify(log));
}

/* ---------- working days (SIP reminders) ---------- */
function isHoliday(d) { const k = localISO(d); return MARKET_HOLIDAYS.has(k) || (S.prefs?.holidays || []).includes(k); }
function isWorkingDay(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !isHoliday(d); }
function workingDayFor(y, m, day, rule) {
  let d = onDay(y, m, day), guard = 0;
  while (!isWorkingDay(d) && guard++ < 12) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (rule === 'prev' ? -1 : 1));
  return d;
}
function whyMoved(y, m, day, d) {

  if (sod(base).getTime() === sod(d).getTime()) return '';

/* ---------- per-item maths ---------- */
function goldStats(it) {
  const p = pays(it);
  const grams = num(it.initialGrams) + p.reduce((s, x) => s + num(x.g), 0);
  const spent = num(it.initialSpent) + sumAmt(p);
  const months = num(it.initialMonths) + p.length;
  const rate = goldRate();
  const paidNow = paidIn(it, ym(new Date()));
  return { grams, spent, months, total: num(it.totalMonths), value: rate ? grams * rate : 0, avg: grams ? spent / grams : 0, paidThisMonth: paidNow.length > 0, paidOn: paidNow[0]?.d };
}
function rdStats(it) {
  const P = num(it.amount), r = num(it.rate) / 100, N = Math.max(1, num(it.months));
  const paidCount = num(it.initialPaid) + pays(it).length;
  let maturity = 0;
  for (let k = 1; k <= N; k++) maturity += P * Math.pow(1 + r / 4, 4 * (N - k + 1) / 12);
  const start = parseISO(it.startDate) || new Date();
  const maturityDate = onDay(start.getFullYear(), start.getMonth() + N, start.getDate());
  const elapsed = Math.max(0, (Date.now() - start.getTime()) / (30.4375 * 864e5));
  let value = 0;

/* ---------- what's due ---------- */
function computeDues(days = 30) {
  const today = sod(new Date()), end = new Date(today.getFullYear(), today.getMonth(), today.getDate() + days);
  const floor = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 7);
  const out = [], cur = ym(today);
  const push = o => { if (o.date >= floor && o.date <= end) out.push(o); };
  const monthlyDate = (it, day, paid) => paid ? onDay(today.getFullYear(), today.getMonth() + 1, day) : onDay(today.getFullYear(), today.getMonth(), day);
  for (const it of S.savings) {
    if (it.type === 'gold') {
      const st = goldStats(it);
      if (st.paidThisMonth || (st.total && st.months >= st.total)) continue;
      const g = num(it.gramsPerMonth) || 1, sig = goldSignal();
      push({ date: new Date(today.getFullYear(), today.getMonth() + 1, 0), by: true, title: `${it.name} · ${g} g`, sub: sig ? sig.short : (it.provider || 'Gold scheme'), subTone: sig?.subTone, amt: goldRate() * g, approx: true, pay: () => { location.hash = '#gold'; } });
    } else if (it.type === 'rd') {
      const s = rdStats(it); if (s.paidCount >= s.N) continue;
      push({ date: monthlyDate(it, num(it.day) || 1, paidIn(it, cur).length > 0), title: it.name, sub: `${it.bank ? it.bank + ' · ' : ''}Instalment ${s.paidCount + 1} of ${s.N}`, amt: num(it.amount), pay: () => paySheet('savings', it) });
    } else if (it.type === 'mf') {
      let y = today.getFullYear(), m = today.getMonth();
      if (paidIn(it, cur).length) m += 1;
      const d = workingDayFor(y, m, num(it.day) || 1, it.rule), why = whyMoved(y, m, num(it.day) || 1, d);
      push({ date: d, title: it.fund || it.name, sub: `${it.bank ? 'From ' + it.bank + ' · ' : ''}${why ? why + ' → ' : ''}${it.remind ? 'remind ' + timeLabel(it.time) : 'SIP'}`, subTone: why ? 'warn' : '', amt: num(it.amount), pay: () => paySheet('savings', it) });
    } else if (it.type === 'fd') {
      const s = fdStats(it);
      if (s.daysLeft >= 0) push({ date: sod(s.end), title: `${it.name} matures`, sub: `${it.bank ? it.bank + ' · ' : ''}${inr0(s.maturity)} expected`, amt: 0, info: true, pay: () => savingSheet(it) });
    }
  }
  for (const it of S.loans) {
    if (it.type === 'gold') {
      const s = goldLoanStats(it); if (!s.outstanding) continue;
      const day = num(it.interestDay) || parseISO(it.startDate)?.getDate() || 1;
      const paidInt = pays(it).some(p => String(p.d).startsWith(cur) && p.kind === 'interest');
      push({ date: monthlyDate(it, day, paidInt), title: `${it.name} interest`, sub: `${it.bank || ''}${num(it.grams) ? ' · ' + num(it.grams) + ' g pledged' : ''}`, amt: s.monthlyInterest, pay: () => paySheet('loans', it, { kind: 'interest', amt: s.monthlyInterest }) });
      if (s.end) push({ date: sod(s.end), title: `${it.name}: renew or close`, sub: `${inr0(s.outstanding)} outstanding`, amt: 0, info: true, pay: () => loanSheet(it) });
    } else if (it.type === 'emi') {
      const s = emiStats(it); if (!s.left) continue;
      push({ date: monthlyDate(it, num(it.day) || 1, paidIn(it, cur).length > 0), title: `${it.name} EMI`, sub: `${it.bank ? 'From ' + it.bank + ' · ' : ''}${s.paid + 1} of ${s.total}`, amt: num(it.emi), pay: () => paySheet('loans', it, { kind: 'emi', amt: num(it.emi) }) });
    } else {
      const s = otherLoanStats(it);
      if (s.outstanding && s.due) push({ date: sod(s.due), title: it.name, sub: it.bank || 'Repay by', amt: s.outstanding, pay: () => paySheet('loans', it) });
    }
  }
  for (const it of S.charges) {
    const d = chargeDueDate(it); if (!d) continue;
    push({ date: d, title: it.name, sub: `${it.bank || ''}${it.freq === 'yearly' ? ' · yearly' : it.freq === 'monthly' ? ' · monthly' : ''}`, amt: num(it.amount), pay: () => paySheet('charges', it) });
  }
  for (const c of S.cards) {
    const cy = cardCycle(c);
    if (cy.billed > 0 && !cy.paid) push({ date: sod(cy.due), title: `${c.name} card bill`, sub: c.bank || 'Credit card', amt: cy.billed, pay: () => markCardPaid(c) });
  }
  return out.sort((a, b) => a.date - b.date);
}
function chargeDueDate(it) {

  if (it.freq === 'monthly') return onDay(today.getFullYear(), today.getMonth() + (paidIn(it, cur).length ? 1 : 0), day);
  if (it.freq === 'yearly') {
    const m = (num(it.month) || 1) - 1, y = today.getFullYear();

const SPOT_KEY = 'fsh_spot_v1';
function spotCache() { try { return JSON.parse(localStorage.getItem(SPOT_KEY) || '{}'); } catch { return {}; } }

async function loadSpotHistory() {

  for (let i = 1; i <= 32; i++) { const k = localISO(new Date(t.getFullYear(), t.getMonth(), t.getDate() - i)); if (!c[k]) missing.push(k); }
  for (let i = 0; i < missing.length; i += 6) await Promise.all(missing.slice(i, i + 6).map(d => spotOn(d).catch(() => null)));
}
function goldSeries() {
  const c = spotCache(), prem = latestPremium(), own = {};
  S.goldHist.filter(h => h.source === 'jeweller').forEach(h => { own[h.date] = num(h.rate); });
  const t = new Date(), pts = []; let last = null, ownCount = 0;
  for (let i = 29; i >= 0; i--) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i), k = localISO(d);
    let v = own[k] || null;
    if (v) ownCount++;
    if (!v && i === 0 && goldRate()) v = goldRate();
    if (!v && c[k]) v = Math.round(c[k] * 22 / 24 * prem);

function goldSignal() {
  const rate = goldRate(); if (!rate) return null;
  const { pts, enough } = goldSeries(); if (!enough) return null;
  const vals = pts.map(p => p.v).filter(Boolean);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length, min = Math.min(...vals), max = Math.max(...vals);
  const diff = (rate - avg) / avg * 100, cheaper = vals.filter(v => v > rate).length / vals.length * 100;
  const now = new Date(), daysLeft = daysIn(now.getFullYear(), now.getMonth()) - now.getDate();
  let tone, label, text;
  if (rate <= min * 1.003) { tone = 'good'; label = 'Good day to buy'; text = `Today is the lowest price in 30 days and ${Math.abs(diff).toFixed(1)}% below the 30-day average.`; }
  else if (diff <= -1.5 || cheaper >= 80) { tone = 'good'; label = 'Good day to buy'; text = `Today is ${Math.abs(diff).toFixed(1)}% below the 30-day average and cheaper than ${Math.round(cheaper)}% of the last 30 days.`; }
  else if (diff >= 1 && daysLeft > 5) { tone = 'wait'; label = 'Consider waiting'; text = `Today is ${diff.toFixed(1)}% above the 30-day average, with ${daysLeft} days left this month to find a lower price.`; }
  else { tone = 'ok'; label = 'Average day'; text = `Today is close to the 30-day average (${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)}%).`; }
  if (daysLeft <= 3 && tone !== 'good') { tone = 'soon'; label = 'Pay soon'; text = `Only ${daysLeft} day${daysLeft === 1 ? '' : 's'} left this month. ${text}`; }
  const short = tone === 'good' ? 'Today looks like a good day to buy' : tone === 'wait' ? 'Above average today; wait if you can' : tone === 'soon' ? `Month ends in ${daysLeft} day${daysLeft === 1 ? '' : 's'}` : 'Average price today';
  return { tone, label, text, short, avg, min, max, diff, daysLeft, subTone: tone === 'good' ? 'good' : (tone === 'wait' || tone === 'soon') ? 'warn' : '' };
}
function goldOutlook() {
  const { pts, enough } = goldSeries(); if (!enough) return null;
  const vals = pts.map(p => p.v).filter(Boolean), n = vals.length, recent = vals.slice(-14);
  const mx = (recent.length - 1) / 2, my = recent.reduce((a, b) => a + b, 0) / recent.length;
  let sxy = 0, sxx = 0;
  recent.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) ** 2; });
  const slope = sxx ? sxy / sxx : 0, ch = [];
  for (let i = 1; i < n; i++) ch.push(vals[i] - vals[i - 1]);
  const sd = Math.sqrt(ch.reduce((a, b) => a + b * b, 0) / Math.max(1, ch.length)) || vals[n - 1] * 0.006;
  const base = goldRate() || vals[n - 1], fc = [];
  for (let h = 1; h <= 7; h++) { const c = base + slope * 0.5 * h, w = 1.28 * sd * Math.sqrt(h); fc.push({ c, lo: c - w, hi: c + w }); }
  const pct = slope * 7 / base * 100;

    <input type="text" id="${id}" data-k="fund" autocomplete="off" placeholder="Type to search, e.g. Parag Parikh Flexi" value="${esc(val)}">
    <input type="hidden" data-k="schemeCode" value="${esc(f.code || '')}">
    <span class="small" id="fundNav" style="color:var(--tertiary)"></span><div class="fund-results" id="fundRes"></div></div>`;
  const type = f.type === 'number' ? 'number' : f.type;
  return `<div class="field ${cls}"><label for="${id}">${esc(f.label)}</label><input type="${type}" id="${id}" data-k="${f.k}" ${type === 'number' ? 'inputmode="decimal" step="any" min="0"' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} value="${esc(val)}">${help}</div>`;
}
function readForm(el, fields) {
  const out = {};
  el.querySelectorAll('[data-k]').forEach(i => {
    const f = fields.find(x => x.k === i.dataset.k);
    if (i.type === 'checkbox') out[i.dataset.k] = i.checked;
    else if (f && (f.type === 'number' || (f.type === 'select' && typeof f.options?.[0]?.[0] === 'number'))) out[i.dataset.k] = num(i.value);
    else out[i.dataset.k] = i.value.trim();
  });
  return out;
}
function formSheet({ title, intro, fields, values = {}, required = [], onSave, onDelete, saveLabel = 'Save' }) {
  openSheet(`<h3>${esc(title)}</h3>${intro ? `<p class="muted small" style="margin:0 0 12px;line-height:1.5">${intro}</p>` : ''}
    <div class="fgrid" style="margin-top:8px">${fields.map(f => fieldHTML(f, values[f.k])).join('')}</div>
    <div class="actions">${onDelete ? '<button class="btn danger" data-del>Delete</button>' : ''}<button class="btn" data-c>Cancel</button><button class="btn primary" data-s>${esc(saveLabel)}</button></div>`, el => {
    el.querySelector('[data-c]').onclick = closeSheet;
    el.querySelectorAll('input[type=checkbox][data-k="remind"],input[type=checkbox][data-k="notifyBuy"]').forEach(c => c.addEventListener('change', () => { if (c.checked) askNotifyPermission(); }));
    if (el.querySelector('#fundRes')) wireFundSearch(el);
    el.querySelector('[data-del]')?.addEventListener('click', onDelete);
    el.querySelector('[data-s]').onclick = async () => {
      const v = readForm(el, fields);
      for (const k of required) {
        const f = fields.find(x => x.k === k);
        if (f && ((f.type === 'number' && !(num(v[k]) > 0)) || (f.type !== 'number' && !v[k]))) { toast(`Please fill in “${f.label}”`, 'warning'); el.querySelector(`[data-k="${k}"]`)?.focus(); return; }
      }
      if (await onSave(v) !== false) { sheetResolve = null; closeSheet(); }
    };
  });
}
function wireFundSearch(el) {
  const inp = el.querySelector('[data-k="fund"]'), code = el.querySelector('[data-k="schemeCode"]'), res = el.querySelector('#fundRes'), navEl = el.querySelector('#fundNav');
  const showNav = async c => { if (!c) { navEl.textContent = ''; return; } navEl.textContent = 'Checking latest NAV…'; const n = await fetchNav(c); navEl.textContent = n ? `NAV ₹${n.nav} on ${n.date} · from AMFI via MFapi.in` : 'Couldn’t fetch NAV right now; value will update later.'; };
  if (code.value) showNav(code.value);
  let t = null;
  inp.addEventListener('input', () => {
    code.value = ''; navEl.textContent = '';
    clearTimeout(t); const q = inp.value.trim();
    if (q.length < 3) { res.innerHTML = ''; return; }
    t = setTimeout(async () => {
      res.innerHTML = '<span class="small muted">Searching…</span>';
      const list = await searchFunds(q);
      if (list === null) { res.innerHTML = '<span class="small muted">Fund search is unavailable right now. You can still save the name.</span>'; return; }
      res.innerHTML = list.length ? list.map(f => `<button type="button" data-code="${esc(f.schemeCode)}">${esc(f.schemeName)}</button>`).join('') : '<span class="small muted">No matching funds. Try a shorter name.</span>';
      res.querySelectorAll('[data-code]').forEach(b => b.onclick = () => { inp.value = b.textContent; code.value = b.dataset.code; res.innerHTML = ''; showNav(b.dataset.code); });
    }, 350);
  });
}

function paySheet(kind, it, opts = {}) {
  const isGold = kind === 'savings' && it.type === 'gold', isMF = kind === 'savings' && it.type === 'mf', isGoldLoan = kind === 'loans' && it.type === 'gold';
  const g = num(it.gramsPerMonth) || 1, rate = goldRate();
  let def = opts.amt ?? (isGold ? Math.round(g * rate) : num(it.amount || it.emi || it.amount));
  if (isGoldLoan && !opts.amt) def = goldLoanStats(it).monthlyInterest;
  if (kind === 'loans' && it.type === 'other' && !opts.amt) def = otherLoanStats(it).outstanding;
  const nav = isMF ? navCache(it.schemeCode) : null;
  openSheet(`<h3>${isGold ? 'Mark this month paid' : 'Record payment'}</h3>
    <p class="muted small" style="margin:0 0 12px">${esc(it.fund || it.name)}${isGold ? ` · ${esc(it.provider || '')}` : ''}</p>
    <div class="fgrid">
      ${isGold ? `<div class="field"><label for="pG">Grams</label><input type="number" id="pG" inputmode="decimal" step="any" min="0" value="${g}"></div>
        <div class="field"><label for="pR">Rate (₹ per g)</label><input type="number" id="pR" inputmode="decimal" step="any" min="0" value="${rate || ''}"></div>` : ''}
      ${isGoldLoan ? `<div class="field full"><label for="pK">Payment for</label><select id="pK"><option value="interest" ${opts.kind !== 'part' ? 'selected' : ''}>Monthly interest</option><option value="part" ${opts.kind === 'part' ? 'selected' : ''}>Part repayment of principal</option><option value="close">Full closure</option></select></div>` : ''}
      <div class="field full"><label for="pA">Amount (₹)</label><div class="amount-wrap"><span>₹</span><input type="number" id="pA" class="amount-input" inputmode="decimal" step="any" min="0" value="${def ? Math.round(def * 100) / 100 : ''}"></div>
        ${isMF ? `<span class="small muted" id="pU">${nav ? `Adds about ${(def / nav.nav).toFixed(3)} units at NAV ₹${nav.nav}` : 'Units will update once the NAV is available'}</span>` : ''}</div>
      <div class="field"><label for="pD">Paid on</label><input type="date" id="pD" value="${localISO(new Date())}" max="${localISO(new Date())}"></div>
      <div class="field"><label for="pB">From bank</label>${bankSelectHTML('pB', it.bank)}</div>
    </div>
    <div class="actions"><button class="btn" data-c>Cancel</button><button class="btn primary" data-s>Save payment</button></div>`, el => {
    const q = s => el.querySelector(s);
    q('[data-c]').onclick = closeSheet;
    const recalc = () => { if (isGold) q('#pA').value = Math.round(num(q('#pG').value) * num(q('#pR').value) * 100) / 100; };
    if (isGold) { q('#pG').oninput = recalc; q('#pR').oninput = recalc; }
    if (isGoldLoan) q('#pK').onchange = () => { const k = q('#pK').value, s = goldLoanStats(it); q('#pA').value = k === 'interest' ? s.monthlyInterest : k === 'close' ? s.outstanding : ''; };
    if (isMF && nav) q('#pA').oninput = () => { q('#pU').textContent = `Adds about ${(num(q('#pA').value) / nav.nav).toFixed(3)} units at NAV ₹${nav.nav}`; };
    q('[data-s]').onclick = () => {
      const amt = r2(num(q('#pA').value));
      if (!(amt > 0)) { toast('Enter the amount paid', 'warning'); return; }
      const p = { d: q('#pD').value || localISO(new Date()), amt, bank: q('#pB').value || it.bank || '' };
      if (isGold) { p.g = num(q('#pG').value); p.rate = num(q('#pR').value); }
      if (isGoldLoan) p.kind = q('#pK').value;
      if (kind === 'loans' && it.type === 'emi') p.kind = 'emi';
      if (isMF && nav) p.u = Math.round(amt / nav.nav * 1000) / 1000;
      updateDoc(refFor(kind, it.id), { payments: [...pays(it), p] }).catch(e => toast(errMsg(e), 'error'));
      sheetResolve = null; closeSheet();
      toast(`Saved ${inr(amt)} payment`, 'success');
    };
  });
}

function goldChart(ol, sig) {
  const { pts, enough } = goldSeries(), el = document.getElementById('cGold'); if (!el) return;
  el.parentElement.querySelector('.chart-empty')?.classList.toggle('hidden', enough);
  if (!enough) { charts.cGold?.destroy(); delete charts.cGold; return; }

  const n = pts.length, nul = k => Array(k).fill(null), last = pts[n - 1].v;

    ds.push({ label: 'Low', data: [...nul(n - 1), last, ...ol.fc.map(f => Math.round(f.lo))], borderColor: 'transparent', pointRadius: 0 });
    ds.push({ label: 'Outlook', data: [...nul(n - 1), last, ...ol.fc.map(f => Math.round(f.c))], borderColor: '#a8c7fa', borderWidth: 2, borderDash: [3, 4], pointRadius: 0 });

/* ---------- reminders for savings, loans, charges, gold ---------- */
function checkMoneyReminders() {
  if (!S.hid || !('Notification' in window) || Notification.permission !== 'granted') return;
  let log; try { log = JSON.parse(localStorage.getItem('fsh_moneyNotified') || '{}'); } catch { log = {}; }
  const now = new Date(), today = sod(now), tk = localISO(today), cur = ym(today);
  const fire = (key, title, body) => { if (log[key]) return; log[key] = tk; notify(title, body).catch(() => {}); };
  const dueCheck = (it, date, title, amtText) => {
    const diff = Math.round((sod(date) - today) / 864e5);
    if (diff <= num(it.remindDays) && diff >= -2) fire(`due_${it.id}_${tk}`, title, `${amtText} ${diff > 0 ? `due in ${diff} day${diff > 1 ? 's' : ''}` : diff === 0 ? 'due today' : 'is overdue'}${it.bank ? ' · ' + it.bank : ''}.`);
  };
  for (const it of S.savings) {
    if (it.type === 'mf' && it.remind && !paidIn(it, cur).length) {
      const d = workingDayFor(today.getFullYear(), today.getMonth(), num(it.day) || 1, it.rule);
      const [hh, mi] = String(it.time || '09:30').split(':').map(Number);
      if (now >= new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mi) && (today - sod(d)) / 864e5 <= 3)
        fire(`sip_${it.id}_${cur}`, `SIP day: ${it.fund || it.name}`, `Pay ${inr(it.amount)}${it.bank ? ' from ' + it.bank : ''} today. Open the app to mark it paid.`);
    }
    if (it.type === 'rd' && it.remind && !paidIn(it, cur).length && rdStats(it).paidCount < rdStats(it).N) dueCheck(it, onDay(today.getFullYear(), today.getMonth(), num(it.day) || 1), `${it.name}: instalment`, inr(it.amount));
    if (it.type === 'gold' && !paidIn(it, cur).length) {
      const sig = goldSignal();
      if (it.notifyBuy && sig?.tone === 'good') fire(`goldbuy_${it.id}_${tk}`, 'Good day to buy gold', `${sig.text} 22K: ${inr0(goldRate())}/g.`);
      if (num(it.unpaidDay) && today.getDate() >= num(it.unpaidDay)) fire(`goldunpaid_${it.id}_${tk}`, `${it.name}: this month is unpaid`, `${daysIn(today.getFullYear(), today.getMonth()) - today.getDate()} days left. Today’s 22K rate is ${inr0(goldRate())}/g.`);
    }
  }
  for (const it of S.loans) {
    if (!it.remind) continue;
    if (it.type === 'emi' && emiStats(it).left && !paidIn(it, cur).length) dueCheck(it, onDay(today.getFullYear(), today.getMonth(), num(it.day) || 1), `${it.name} EMI`, inr(it.emi));
    if (it.type === 'gold') {
      const s = goldLoanStats(it);
      if (s.outstanding && !pays(it).some(p => p.kind === 'interest' && String(p.d).startsWith(cur))) dueCheck(it, onDay(today.getFullYear(), today.getMonth(), num(it.interestDay) || 1), `${it.name} interest`, inr0(s.monthlyInterest));
    }
    if (it.type === 'other') { const s = otherLoanStats(it); if (s.outstanding && s.due) dueCheck(it, s.due, it.name, inr0(s.outstanding)); }
  }
  for (const it of S.charges) { if (!it.remind) continue; const d = chargeDueDate(it); if (d) dueCheck(it, d, it.name, inr(it.amount)); }
  const cutoff = localISO(new Date(today.getFullYear(), today.getMonth() - 2, 1));
  for (const k of Object.keys(log)) if (log[k] < cutoff) delete log[k];
  localStorage.setItem('fsh_moneyNotified', JSON.stringify(log));
}

/* =====================================================================
   8. NOTIFICATIONS, REMINDER, INSTALL, SERVICE WORKER
   ===================================================================== */
let swReg = null;
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(e => console.warn('SW', e));
}
async function notify(title, body) {
  const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'fsh-reminder' };
  const reg = swReg || (navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null);
  if (reg) return reg.showNotification(title, opts);
  return new Notification(title, opts);
}
function reminderSettings() { try { return Object.assign({ enabled: false, time: '21:30', last: '' }, JSON.parse(localStorage.getItem('fsh_reminder') || '{}')); } catch { return { enabled: false, time: '21:30', last: '' }; } }
function saveReminder(r) { localStorage.setItem('fsh_reminder', JSON.stringify(r)); }
async function toggleReminder() {
  const r = reminderSettings();
  if (!r.enabled) {
    if (!('Notification' in window)) return toast('Notifications aren’t supported here', 'warning');
    if (await Notification.requestPermission() !== 'granted') return toast('Allow notifications for this app in Android settings', 'warning');
    r.enabled = true; r.time = $('#remTime')?.value || r.time; r.last = '';
  } else r.enabled = false;
  saveReminder(r);
  const b = $('#remToggle'); if (b) { b.textContent = r.enabled ? 'Turn off' : 'Turn on'; b.className = `btn ${r.enabled ? 'danger' : 'ok'}`; }
  toast(r.enabled ? 'Reminder on' : 'Reminder off', 'info');
}
function checkReminder() {
  checkCardReminders();
  try { checkMoneyReminders(); } catch (e) { console.warn(e); }
  const r = reminderSettings(); if (!r.enabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(), hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`, today = dayKey(now);
  if (hm >= r.time && r.last !== today) {
    r.last = today; saveReminder(r);
    const logged = S.expenses.filter(e => dayKey(e.date) === today).reduce((s, e) => s + Number(e.amount || 0), 0);
    notify('Log today’s cash spends', `You’ve logged ${inr(logged)} today. Paid cash for anything else?`).catch(() => {});
  }
}
setInterval(checkReminder, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkReminder(); });

let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; setupInstall(); });
function setupInstall() {
  const btn = $('#installBtn'); if (!btn) return;
  if (matchMedia('(display-mode: standalone)').matches) { $('#installCard')?.classList.add('hidden'); return; }
  if (installEvt) {
    btn.classList.remove('hidden'); $('#installHint').textContent = 'Adds Family Spend Hub to your home screen like a normal app.';
    btn.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; btn.classList.add('hidden'); };
  }
}

/* =====================================================================
   9. START
   ===================================================================== */
if (!configured) {
  screenSetup();
} else {
  getRedirectResult(auth).catch(e => toast(errMsg(e), 'error'));
  onAuthStateChanged(auth, user => {
    teardown();
    S.user = user;
    if (!user) return screenSignIn();
    boot();
  });
}
</script>
