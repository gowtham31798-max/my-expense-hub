<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101216" />
<meta name="robots" content="noindex, nofollow" />
<title>Family Spend Hub</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#101216;--surface:#1b1d24;--surface2:#252833;--outline:#383c4a;--line:rgba(56,60,74,.65);
  --primary:#a8c7fa;--primary-dim:#7ca4e8;--on-primary:#0b1220;--tertiary:#9cd67d;--warning:#fed079;--error:#ffb4ab;
  --text:#e1e2ec;--dim:#9398a8;--nav-h:64px;--top-h:65px;color-scheme:dark;
  /* phones: the Netlify badge sits bottom-right (~123x27px); nav stays left of it, FAB stays above it */
  --nav-bottom:max(12px, calc(env(safe-area-inset-bottom, 0px) - 12px));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--primary)}
h1,h2,h3{line-height:1.25}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* shell */
.topbar{position:sticky;top:0;z-index:20;background:rgba(16,18,22,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dim));color:var(--on-primary);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.top-title{min-width:0;flex:1}
.top-title small{display:block;color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;color:var(--primary);overflow:hidden}
.avatar{position:relative}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.lg{width:56px;height:56px;font-size:20px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tertiary);white-space:nowrap}
.net .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.net.off{color:var(--warning)}
.body{display:flex}
main{flex:1;min-width:0}
.content{max-width:1100px;margin:0 auto;padding:16px 16px calc(var(--nav-bottom) + 170px)}
/* nav: floating pill on phones, side rail on laptops */
.nav{position:fixed;left:12px;bottom:var(--nav-bottom);z-index:30;width:min(232px, calc(100vw - 160px));height:var(--nav-h);box-sizing:border-box;padding:0 4px;border-radius:24px;background:rgba(27,29,36,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--outline);box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:space-between}
.nav a,.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;position:relative}
.nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav .pill{width:44px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:20px;transition:background .2s}
.nav .active{color:var(--primary)}
.nav .active .pill{background:rgba(168,199,250,.18)}
.nav .desk{display:none}
.badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--error);color:#3b0907;font-size:11px;font-weight:800;display:grid;place-items:center}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-bottom) + 58px);z-index:31;height:56px;padding:0 20px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab i{font-size:20px}
.fab.finish{background:var(--tertiary);color:#0e2a05}
.fab:active{transform:scale(.96)}
.more-row{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border-radius:14px;color:var(--text);text-decoration:none;font-size:15px;font-weight:600;width:100%;text-align:left}
.more-row:hover{background:var(--surface2)}
.more-row i.lead{font-size:22px;color:var(--primary)}
.more-row .grow{flex:1}
@media (max-width:899px){.desk-only{display:none!important}}
/* money screens */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg a{min-height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--dim);text-decoration:none;text-align:center;padding:0 6px}
.seg a.on{background:var(--primary);color:var(--on-primary);font-weight:800}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:12px 10px;border-radius:16px;background:var(--surface2);color:var(--text);text-decoration:none;min-width:0}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.06em}
.tile .v{font-size:clamp(15px,4.3vw,19px);font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:14px;background:#14161e}
.c-spent{color:var(--warning)}.c-saved{color:var(--tertiary)}.c-loan{color:#f4a7d3}
.bg-spent{background:var(--warning)}.bg-saved{background:var(--tertiary)}.bg-loan{background:#f4a7d3}
.due{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--text)}
.dues .due:last-child{border-bottom:0}
.due-date{width:42px;text-align:center;flex-shrink:0}
.due-date span{display:block;font-size:11px;color:var(--dim);font-weight:700}
.due-date b{display:block;font-size:18px;font-weight:800}
.due .t1{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due .t2{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.due .amt{font-size:14px;font-weight:800;white-space:nowrap}
.tone-good{color:var(--tertiary)!important}.tone-warn{color:var(--warning)!important}
.gold-card{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;border-color:rgba(254,208,121,.35)}
.ic-box.gold{background:rgba(254,208,121,.15);color:var(--warning)}
.ic-box.green{background:rgba(156,214,125,.15);color:var(--tertiary)}
.ic-box.pink{background:rgba(244,167,211,.15);color:#f4a7d3}
.ic-box.blue2{background:rgba(196,231,255,.15);color:#c4e7ff}
.mini3,.mini2{display:grid;gap:8px;margin-top:12px}
.mini3{grid-template-columns:repeat(3,minmax(0,1fr))}.mini2{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}
.mini{display:block;padding:8px 10px;border-radius:12px;background:var(--surface2);min-width:0}
.mini .k{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{display:block;font-size:clamp(13px,3.6vw,15px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-card{display:block;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.item-card .top{display:flex;align-items:center;gap:12px}
.item-card .grow{min-width:0}
.item-card .t1{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.item-card .t2{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.item-card .right{text-align:right;flex-shrink:0}
.item-card .right .t1{white-space:nowrap}
.meter{height:10px;border-radius:5px;background:#14161e;overflow:hidden;margin-top:8px}
.btn.dashed{border-style:dashed;background:none;color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fgrid .switch{margin:0}
.fund-results{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:220px;overflow:auto}
.fund-results button{padding:10px 12px;border-radius:12px;background:var(--surface2);text-align:left;font-size:13px;line-height:1.4}
.bank-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bank-chip{min-height:46px;border-radius:14px;border:1px solid var(--outline);background:var(--surface2);font-weight:700;font-size:13px;padding:4px;line-height:1.2}
.bank-chip.on{border:2px solid var(--primary);background:rgba(168,199,250,.15);color:var(--primary)}
.bank-row{display:block;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--text)}
.bank-bar{display:flex;gap:2px;height:8px;margin-top:8px}
.bank-bar span{display:block;border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--text)}
.linklike{color:var(--primary);font-weight:700;font-size:inherit;text-decoration:underline;padding:0;background:none}
.fab.pay{background:var(--primary)}
@media (max-width:380px){.tile .v{font-size:15px}.tiles3{gap:6px}.tile{padding:10px 8px}}
@media (min-width:900px){
  .nav{position:sticky;top:var(--top-h);left:auto;bottom:auto;align-self:flex-start;flex-direction:column;justify-content:flex-start;gap:4px;width:230px;height:calc(100dvh - var(--top-h));border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;padding:16px 12px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .nav .desk{display:flex}
  .nav .mob{display:none}
  .nav a,.nav button{flex:none;flex-direction:row;gap:12px;padding:10px 12px;border-radius:14px;font-size:14px;width:100%}
  .nav .pill{width:auto;height:auto;background:none!important}
  .nav .active{background:rgba(168,199,250,.14)}
  .badge{position:static;margin-left:auto}
  .content{padding:24px 24px 120px}
  .fab.log{display:none}
  .fab{right:24px;bottom:80px}
}
/* building blocks */
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.cols-2-always{grid-template-columns:1fr 1fr}
@media(min-width:600px){.cols-2{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.cols-3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 i{color:var(--primary);font-size:18px}
.card h2 .right{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim)}
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:24px;padding:20px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.big{font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.mid-num{font-size:clamp(18px,5vw,22px);font-weight:800;margin-top:4px}
.muted{color:var(--dim)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.progress{height:10px;border-radius:5px;background:#14161e;overflow:hidden;margin-top:6px}
.progress>div{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--tertiary));transition:width .4s}
.progress.over>div{background:var(--error)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line);color:var(--text);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.danger{color:var(--error);border-color:rgba(255,180,171,.35)}
.btn.ok{color:var(--tertiary);border-color:rgba(156,214,125,.35)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.gbtn{background:#fff;color:#1f1f1f;border-color:transparent}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--dim);font-size:20px;flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{width:100%;min-height:46px;padding:10px 14px;background:var(--surface2);border:1px solid var(--outline);border-radius:14px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.amount-input{font-size:28px!important;font-weight:800;padding-left:40px!important;min-height:60px!important}
.amount-wrap{position:relative}
.amount-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:800;color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:12px;font-weight:700;color:var(--dim)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:11px;font-weight:700;text-align:center;min-width:0}
.chip i{font-size:20px}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill-btn{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface2);color:var(--dim);font-size:13px;font-weight:700;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.pill-btn.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
/* rows */
.txn{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface2);border:1px solid transparent;width:100%;text-align:left}
.list-plain .txn{background:var(--surface);border-color:var(--line)}
.txn .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;background:rgba(168,199,250,.15);color:var(--primary);flex-shrink:0}
.txn .ic.cash{background:rgba(254,208,121,.15);color:var(--warning)}
.txn .ic.credit{background:rgba(244,167,211,.15);color:#f4a7d3}
.txn .mid{flex:1;min-width:0}
.txn .t1,.txn .t2{display:block}
.txn .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn .t2{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.txn .amt{font-weight:800;font-size:15px;white-space:nowrap}
.ic-box{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:rgba(168,199,250,.15);color:var(--primary);flex-shrink:0}
.ic-box.cash{background:rgba(254,208,121,.15);color:var(--warning)}
.ic-box.credit{background:rgba(244,167,211,.15);color:#f4a7d3}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head h3{margin:0;word-break:break-word}
.sheet-head .amt{font-size:22px;font-weight:800;white-space:nowrap;flex-shrink:0}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.detail-grid dt{color:var(--dim)}.detail-grid dd{margin:0;font-weight:600;min-width:0;word-break:break-word}
.cc{padding:14px;border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.cc-top{display:flex;align-items:center;gap:12px}
.cc-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc-nums div{padding:10px;border-radius:12px;background:var(--surface)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:14px}
.switch input{width:22px;height:22px;accent-color:var(--primary)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(254,208,121,.15);color:var(--warning);vertical-align:middle}
.tag.ok{background:rgba(156,214,125,.15);color:var(--tertiary)}
.tag.blue{background:rgba(168,199,250,.15);color:var(--primary)}
.tag.red{background:rgba(255,180,171,.15);color:var(--error)}
.day-head{font-size:12px;font-weight:700;color:var(--dim);margin:14px 4px 6px;display:flex;justify-content:space-between}
.empty{padding:24px 12px;text-align:center;color:var(--dim);font-size:14px}
.empty i{font-size:32px;display:block;margin-bottom:6px}
.chart-box{position:relative;height:230px}
.chart-box.short{height:190px}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center}
.member{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface2);border:1px solid transparent;text-align:left;width:100%;color:inherit;text-decoration:none}
.member:hover{border-color:var(--outline)}
.bar{height:6px;border-radius:3px;background:#14161e;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:var(--primary);border-radius:3px}
/* list items */
.item{position:relative;overflow:hidden;border-radius:16px;background:var(--surface2);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item .face{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:transform .2s}
.item .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:13px}
.item .under .l{color:var(--tertiary)}
.item .under .r{color:var(--warning)}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--outline);display:grid;place-items:center;flex-shrink:0;font-size:16px}
.item.got .check{background:var(--tertiary);border-color:var(--tertiary);color:#0e2a05}
.item.got .iname{text-decoration:line-through;color:var(--dim)}
.item.na .check{border-color:var(--warning);color:var(--warning)}
.iname{font-weight:700;font-size:15px;word-break:break-word}
.imeta{font-size:12px;color:var(--dim);margin-top:2px}
.item.na .imeta{color:var(--warning)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px;font-size:13px;font-weight:700;color:var(--dim)}
.list-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
.list-card .ic{width:44px;height:44px;border-radius:14px;background:rgba(156,214,125,.15);color:var(--tertiary);display:grid;place-items:center;font-size:22px}
/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 16px calc(var(--nav-bottom) + 76px)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#4a4f5e;margin:0 auto 14px}
@media(min-width:600px){.scrim{align-items:center;padding:24px}.sheet{border-radius:24px;padding:20px 16px}.sheet::before{display:none}}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media(max-width:599px){
  .sheet .actions{justify-content:stretch}
  .sheet .actions > *{flex:1 1 0;min-height:48px}
  .sheet .actions > .primary{flex:1 1 100%;order:-1;min-height:52px}
  .sheet .actions > span{flex-basis:100%;text-align:center}
}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:440px;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--outline);font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:drop .3s ease}
.toast.success{border-color:rgba(156,214,125,.55)}.toast.warning{border-color:rgba(254,208,121,.55)}.toast.error{border-color:rgba(255,180,171,.65)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.center{min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.auth{width:100%;max-width:440px}
.auth .logo{width:64px;height:64px;font-size:32px;border-radius:20px;margin:0 auto 16px}
.auth h1{font-size:26px;margin:0 0 8px;text-align:center}
.auth p.lead{text-align:center;color:var(--dim);margin:0 0 24px;line-height:1.5}
.notice{padding:12px 14px;border-radius:14px;background:rgba(254,208,121,.08);border:1px solid rgba(254,208,121,.3);color:var(--warning);font-size:13px;line-height:1.5}
.notice.info{background:rgba(168,199,250,.08);border-color:rgba(168,199,250,.3);color:var(--primary)}
.notice.err{background:rgba(255,180,171,.08);border-color:rgba(255,180,171,.35);color:var(--error)}
.divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;font-weight:700;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--primary);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"><div class="center"><div class="spinner" aria-label="Loading"></div></div></div>
<div id="toasts" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, getDocs,
  setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, writeBatch, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================================
   1. CONFIG — paste your values from Firebase console → Project settings → Your apps
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyA6Rqr0IcWpY-SD6r2XLeu0OdduAeoadMo",
  authDomain: "spend-hub-6e25d.firebaseapp.com",
  projectId: "spend-hub-6e25d",
  storageBucket: "spend-hub-6e25d.firebasestorage.app",
  messagingSenderId: "79407479311",
  appId: "1:79407479311:web:f5b9b28567c849cba0817a"
};

const CATEGORIES = [
  { id: 'Groceries', icon: 'basket', color: '#9cd67d' },
  { id: 'Dining', icon: 'fork-knife', color: '#fed079' },
  { id: 'Transport', icon: 'taxi', color: '#a8c7fa' },
  { id: 'Household', icon: 'house-line', color: '#c4e7ff' },
  { id: 'Utilities', icon: 'lightning', color: '#ffb4ab' },
  { id: 'Health', icon: 'first-aid-kit', color: '#f4a7d3' },
  { id: 'Personal', icon: 'shopping-bag', color: '#b39ddb' },
  { id: 'Other', icon: 'dots-three-outline', color: '#9398a8' }
];
const MODES = ['Cash', 'UPI', 'Debit card', 'Credit card', 'Bank transfer'];
const BANK_MODES = ['UPI', 'Debit card', 'Bank transfer', 'Bank'];
const modeIcon = m => ({ Cash: 'money', UPI: 'qr-code', 'Debit card': 'credit-card', 'Credit card': 'credit-card', Card: 'credit-card', Bank: 'bank' }[m] || 'wallet');
const modeLabel = e => {
  if (e.mode === 'Credit card') return e.cardName ? `Credit card · ${e.cardName}` : 'Credit card';
  if (e.mode === 'Cash') return 'Cash';
  const m = e.mode === 'Bank' ? 'Bank transfer' : e.mode;
  return e.bank ? `${m} · ${e.bank}` : m;
};
const HISTORY_MONTHS = 13;

/* =====================================================================
   2. HELPERS
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'there';
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const dayKey = d => d.toDateString();
const monthsAgo = m => { const d = new Date(); d.setMonth(d.getMonth() - m, 1); d.setHours(0, 0, 0, 0); return d; };
const localISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const appUrl = () => location.origin + location.pathname;
const joinUrl = hid => `${appUrl()}?join=${encodeURIComponent(hid)}`;

function timeAgo(d) {
  if (!d) return '';
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 604800) return `${Math.floor(s / 86400)}d ago`;
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}
function dayLabel(d) {
  const t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if (dayKey(d) === dayKey(t)) return 'Today';
  if (dayKey(d) === dayKey(y)) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
}
function avatar(m, cls = '') {
  const photo = m?.photo ? `<img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="avatar ${cls}">${esc(initials(m?.name || m?.email))}${photo}</span>`;
}
function toast(msg, type = 'info') {
  const icons = { info: 'info', success: 'check-circle', warning: 'warning', error: 'warning-octagon' };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="ph-bold ph-${icons[type] || 'info'}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3800);
}
function errMsg(e) {
  const c = e?.code || '';
  if (c.includes('permission-denied')) return 'You don’t have permission to do that.';
  if (c.includes('unavailable')) return 'You’re offline. It will sync when you’re back online.';
  if (c === 'auth/unauthorized-domain') return 'This website isn’t authorised in Firebase yet (Authentication → Settings → Authorised domains).';
  if (c === 'auth/network-request-failed') return 'No internet connection.';
  return e?.message || String(e);
}

/* sheets & confirmations */
let sheetResolve = null;
function openSheet(html, onMount) {
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim'; scrim.id = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
  document.body.appendChild(scrim);
  onMount?.(scrim.firstElementChild);
  scrim.querySelector('input:not([type=checkbox]),select')?.focus({ preventScroll: true });
}
function closeSheet() {
  $('#scrim')?.remove();
  if (sheetResolve) { const r = sheetResolve; sheetResolve = null; r(false); }
}
function ask(title, body, okLabel = 'Confirm', danger = false) {
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><p class="muted" style="line-height:1.5">${body}</p>
      <div class="actions"><button class="btn" data-no>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button></div>`,
      el => {
        sheetResolve = res;
        el.querySelector('[data-no]').onclick = () => closeSheet();
        el.querySelector('[data-yes]').onclick = () => { sheetResolve = null; closeSheet(); res(true); };
      });
  });
}
async function shareText(title, text, url) {
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url ? `${text}\n${url}` : text); toast('Copied — paste it in WhatsApp or SMS', 'success'); }
  catch { openSheet(`<h3>Copy this</h3><textarea rows="4" readonly>${esc(url ? `${text}\n${url}` : text)}</textarea><div class="actions"><button class="btn" onclick="document.getElementById('scrim').remove()">Done</button></div>`); }
}

/* charts */
const charts = {};
function drawChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  const first = !charts[id];
  charts[id]?.destroy();
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: first ? undefined : false }, cfg.options);
  charts[id] = new Chart(el, cfg);
}
function destroyCharts() { Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function catChart(id, byCat) {
  const el = document.getElementById(id); if (!el) return;
  const entries = CATEGORIES.map(c => [c.id, byCat[c.id] || 0]).filter(([, v]) => v > 0);
  el.parentElement.querySelector('.chart-empty')?.classList.toggle('hidden', entries.length > 0);
  if (!entries.length) { charts[id]?.destroy(); delete charts[id]; return; }
  drawChart(id, {
    type: 'doughnut',
    data: { labels: entries.map(e => e[0]), datasets: [{ data: entries.map(e => e[1]), backgroundColor: entries.map(e => catOf(e[0]).color), borderColor: '#1b1d24', borderWidth: 2 }] },
    options: { cutout: '68%', plugins: {
      legend: { position: el.parentElement.clientWidth < 380 ? 'bottom' : 'right', labels: { color: '#e1e2ec', boxWidth: 10, padding: 10, font: { size: 11, family: 'Plus Jakarta Sans' } } },
      tooltip: { callbacks: { label: c => ' ' + inr(c.raw) } } } }
  });
}
function trendChart(id, days) {
  drawChart(id, {
    type: 'bar',
    data: { labels: days.map(d => d.label), datasets: [{ data: days.map(d => d.total), backgroundColor: '#a8c7fa', borderRadius: 8 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + inr(c.raw) } } },
      scales: { x: { grid: { display: false }, ticks: { color: '#9398a8', font: { size: 11 } } },
                y: { grid: { color: '#252833' }, ticks: { color: '#9398a8', font: { size: 11 }, callback: v => '₹' + Number(v).toLocaleString('en-IN') } } } }
  });
}
function chartBox(id, short, emptyText = 'Nothing logged this month yet') {
  return `<div class="chart-box ${short ? 'short' : ''}"><canvas id="${id}" role="img" aria-label="chart"></canvas><div class="chart-empty hidden">${esc(emptyText)}</div></div>`;
}

/* expense maths */
function stats(list) {
  const now = new Date(), today = dayKey(now), m = now.getMonth(), y = now.getFullYear();
  const byCat = {}; CATEGORIES.forEach(c => byCat[c.id] = 0);
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push({ key: dayKey(d), label: d.toLocaleDateString('en-IN', { weekday: 'short' }), total: 0 }); }
  const r = { today: 0, month: 0, monthN: 0, cash: 0, cashN: 0, digital: 0, digitalN: 0, byCat, days };
  for (const e of list) {
    const a = Number(e.amount) || 0, d = e.date;
    if (dayKey(d) === today) r.today += a;
    if (d.getMonth() === m && d.getFullYear() === y) {
      r.month += a; r.monthN++;
      byCat[byCat[e.category] !== undefined ? e.category : 'Other'] += a;
      if (e.mode === 'Cash') { r.cash += a; r.cashN++; } else { r.digital += a; r.digitalN++; }
    }
    const day = days.find(x => x.key === dayKey(d)); if (day) day.total += a;
  }
  return r;
}
function txnRow(e, { showMember = false } = {}) {
  const c = catOf(e.category);
  const bits = [];
  if ((e.merchant || '') !== e.category) bits.push(esc(e.category));
  bits.push(esc(modeLabel(e)));
  if (showMember) bits.unshift(esc(e.memberName || 'Member'));
  bits.push(e.date.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }));
  return `<button class="txn" data-exp="${esc(e.id)}">
    <span class="ic ${e.mode === 'Cash' ? 'cash' : e.mode === 'Credit card' ? 'credit' : ''}"><i class="ph-bold ph-${c.icon}"></i></span>
    <span class="mid"><span class="t1">${esc(e.merchant || e.category)}</span>
      <span class="t2">${bits.join(' · ')}${e.pending ? ' · <span class="tag">Not synced</span>' : ''}</span></span>
    <span class="amt">${inr(e.amount)}</span></button>`;
}
function groupedTxns(list, opts) {
  if (!list.length) return `<div class="empty"><i class="ph ph-receipt"></i>No expenses here yet.</div>`;
  let html = '', cur = '';
  const totals = {};
  list.forEach(e => { const k = dayKey(e.date); totals[k] = (totals[k] || 0) + Number(e.amount || 0); });
  for (const e of list) {
    const k = dayKey(e.date);
    if (k !== cur) { if (cur) html += '</div>'; cur = k; html += `<div class="day-head"><span>${esc(dayLabel(e.date))}</span><span>${inr(totals[k])}</span></div><div class="stack" style="gap:8px">`; }
    html += txnRow(e, opts);
  }
  return html + '</div>';
}
function csvCell(v) { return `"${String(v ?? '').replace(/"/g, '""')}"`; }
function downloadCSV(list, name) {
  if (!list.length) return toast('Nothing to export', 'warning');
  const head = ['Date', 'Amount', 'Category', 'Merchant', 'Mode', 'Member', 'ID'];
  const rows = list.map(e => [e.date.toISOString(), e.amount, e.category, e.merchant, e.mode, e.memberName, e.id].map(csvCell).join(','));
  const blob = new Blob(['\ufeff' + head.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}_${localISO(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV downloaded — open it in Google Sheets with File → Import', 'success');
}

/* =====================================================================
   3. FIREBASE + STATE
   ===================================================================== */
const configured = !firebaseConfig.apiKey.startsWith('PASTE');
let auth, db;
if (configured) {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { console.warn('Offline cache unavailable', e); db = getFirestore(fbApp); }
}

const S = {
  user: null, hid: null, household: null, me: null, members: [], expenses: [], family: [],
  lists: [], items: {}, requests: [], invites: [], cards: [], unsubs: [], itemUnsubs: {}, roleReady: false,
  savings: [], loans: [], charges: [], prefs: {}, gold: null, goldHist: [], goldBooted: false, spotToday: null,
  view: null, viewArg: null, search: '', filter: 'all', indexError: null
};
const uid = () => S.user?.uid;
const isOwner = () => !!S.household && S.household.ownerUid === uid();
const myName = () => S.me?.name || S.user?.displayName || S.user?.email || 'Me';
const expCol = () => collection(db, 'households', S.hid, 'expenses');
const sub = fn => S.unsubs.push(fn);

function teardown() {
  S.unsubs.forEach(u => { try { u(); } catch {} });
  Object.values(S.itemUnsubs).forEach(u => { try { u(); } catch {} });
  Object.assign(S, { hid: null, household: null, me: null, members: [], expenses: [], family: [], lists: [], items: {},
    requests: [], invites: [], cards: [], unsubs: [], itemUnsubs: {}, roleReady: false, view: null, indexError: null,
    savings: [], loans: [], charges: [], prefs: {}, gold: null, goldHist: [], goldBooted: false });
  destroyCharts(); closeSheet();
}

// remember a ?join=<householdId> link until the user is signed in
const params = new URLSearchParams(location.search);
if (params.get('join')) {
  localStorage.setItem('fsh_join', params.get('join'));
  history.replaceState(null, '', location.pathname + location.hash);
}

/* =====================================================================
   4. SIGN-IN & ONBOARDING SCREENS
   ===================================================================== */
const appEl = $('#app');
function screen(html) { teardownView(); appEl.innerHTML = `<div class="center"><div class="auth">${html}</div></div>`; }
function screenLoading(msg) { screen(`<div class="spinner"></div><p class="muted" style="text-align:center;margin-top:16px">${esc(msg)}</p>`); }
function teardownView() { destroyCharts(); S.view = null; }

function screenSetup() {
  screen(`<div class="logo"><i class="ph-bold ph-wrench"></i></div><h1>Almost there</h1>
    <p class="lead">This copy of the app isn’t connected to Firebase yet. Open <b>index.html</b>, paste your Firebase web config into the CONFIG block near the top, and upload it again. The setup guide walks through it.</p>`);
}

function screenSignIn() {
  screen(`<div class="logo"><i class="ph-bold ph-wallet"></i></div>
    <h1>Family Spend Hub</h1>
    <p class="lead">Track spending and share shopping lists with your family. Sign in with your Google account to continue.</p>
    ${localStorage.getItem('fsh_join') ? `<div class="notice info" style="margin-bottom:16px">You opened a family invite link. Sign in to join.</div>` : ''}
    <button class="btn gbtn block" id="gsi" style="min-height:52px;font-size:15px">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google</button>
    <p class="muted small" style="text-align:center;margin-top:20px;line-height:1.5">Your data is stored in your family’s private Firebase project. Only people the household owner approves can see it.</p>`);
  $('#gsi').onclick = signIn;
}

async function signIn() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
      return signInWithRedirect(auth, provider);
    }
    if (e.code !== 'auth/popup-closed-by-user') toast(errMsg(e), 'error');
  }
}

function memberDoc(role) {
  return { uid: uid(), email: S.user.email, name: S.user.displayName || S.user.email, photo: S.user.photoURL || '', role, joinedAt: serverTimestamp() };
}

async function boot() {
  screenLoading('Loading your household…');
  const cacheKey = 'fsh_hid_' + uid();
  try {
    const us = await getDoc(doc(db, 'users', uid()));
    const hid = us.exists() ? us.data().householdId : null;
    if (hid) {
      const ms = await getDoc(doc(db, 'households', hid, 'members', uid()));
      if (ms.exists()) return enterHousehold(hid);
      await setDoc(doc(db, 'users', uid()), { householdId: null, updatedAt: serverTimestamp() });
      localStorage.removeItem(cacheKey);
      return screenOnboarding({ removed: true });
    }
    return screenOnboarding({});
  } catch (e) {
    // offline start: use the household we last opened on this phone
    const cached = localStorage.getItem(cacheKey);
    if (cached) return enterHousehold(cached);
    screen(`<div class="notice err">${esc(errMsg(e))}</div><button class="btn block" style="margin-top:16px" id="retry">Try again</button>`);
    $('#retry').onclick = boot;
  }
}

async function screenOnboarding({ removed = false } = {}) {
  screenLoading('Checking for invitations…');
  const email = (S.user.email || '').toLowerCase();
  let invite = null, joinHH = null, pendingReq = false, badLink = false;
  try { const iv = await getDoc(doc(db, 'invites', email)); if (iv.exists()) invite = iv.data(); } catch (e) { console.warn(e); }
  const joinId = localStorage.getItem('fsh_join');
  if (!invite && joinId) {
    try {
      const h = await getDoc(doc(db, 'households', joinId));
      if (h.exists()) {
        joinHH = { id: joinId, ...h.data() };
        const r = await getDoc(doc(db, 'households', joinId, 'requests', uid()));
        pendingReq = r.exists();
      } else badLink = true;
    } catch (e) { console.warn(e); badLink = true; }
  }
  if (joinHH && pendingReq) return screenWaiting(joinHH);

  const privacy = owner => `<div class="notice" style="margin:12px 0">The owner (${esc(owner)}) will be able to see the expenses you log. Shopping lists are shared with everyone in the household.</div>`;
  let joinCard = '';
  if (invite) {
    joinCard = `<div class="card"><h2><i class="ph-bold ph-envelope-open"></i>You’re invited</h2>
      <p style="margin:0">${esc(invite.ownerName)} added you to <b>${esc(invite.householdName)}</b>.</p>${privacy(invite.ownerName)}
      <button class="btn primary block" id="acceptInv">Join ${esc(invite.householdName)}</button></div>`;
  } else if (joinHH) {
    joinCard = `<div class="card"><h2><i class="ph-bold ph-users-three"></i>Join ${esc(joinHH.name)}</h2>
      <p style="margin:0">Owned by ${esc(joinHH.ownerName)}. They’ll get your request and can approve it from their phone.</p>${privacy(joinHH.ownerName)}
      <button class="btn primary block" id="reqAccess">Request access</button></div>`;
  }

  screen(`<div class="logo"><i class="ph-bold ph-wallet"></i></div>
    <h1>Welcome, ${esc(firstName(S.user.displayName))}</h1>
    <p class="lead">Signed in as ${esc(S.user.email)}</p>
    ${removed ? `<div class="notice err" style="margin-bottom:12px">You’re no longer a member of your previous household.</div>` : ''}
    ${badLink ? `<div class="notice err" style="margin-bottom:12px">That invite link isn’t valid any more. Ask the owner for a new one.</div>` : ''}
    ${joinCard}
    ${joinCard ? '<div class="divider">or</div>' : ''}
    <div class="card"><h2><i class="ph-bold ph-link"></i>Have an invite link?</h2>
      <p class="muted small" style="margin:0 0 10px">Paste the link a family member sent you.</p>
      <div class="row"><input type="url" id="linkIn" placeholder="https://…?join=…" aria-label="Invite link"><button class="btn" id="linkGo">Open</button></div></div>
    <div class="divider">or</div>
    <div class="card"><h2><i class="ph-bold ph-house-line"></i>Start a new household</h2>
      <p class="muted small" style="margin:0 0 10px">You’ll be the owner. You invite family and can see everyone’s expenses.</p>
      <div class="field"><input type="text" id="hhName" maxlength="60" placeholder="e.g. Sharma Family" aria-label="Household name"></div>
      <button class="btn block" style="margin-top:10px" id="createHH">Create household</button></div>
    <button class="btn block" style="margin-top:20px;background:none;border:0;color:var(--dim)" id="so">Sign out</button>`);

  $('#acceptInv') && ($('#acceptInv').onclick = () => joinViaInvite(invite));
  $('#reqAccess') && ($('#reqAccess').onclick = () => requestAccess(joinHH));
  $('#linkGo').onclick = () => {
    const v = $('#linkIn').value.trim();
    let id = v;
    try { id = new URL(v).searchParams.get('join') || ''; } catch {}
    if (!/^[A-Za-z0-9]{10,40}$/.test(id)) return toast('That doesn’t look like an invite link', 'warning');
    localStorage.setItem('fsh_join', id); screenOnboarding({});
  };
  $('#createHH').onclick = () => createHousehold($('#hhName').value.trim());
  $('#so').onclick = () => signOut(auth);
}

async function createHousehold(name) {
  if (!name) return toast('Give your household a name', 'warning');
  const ref = doc(collection(db, 'households'));
  const b = writeBatch(db);
  b.set(ref, { name, ownerUid: uid(), ownerEmail: S.user.email, ownerName: S.user.displayName || S.user.email, monthlyBudget: 50000, createdAt: serverTimestamp() });
  b.set(doc(db, 'households', ref.id, 'members', uid()), memberDoc('owner'));
  b.set(doc(db, 'users', uid()), { householdId: ref.id, updatedAt: serverTimestamp() });
  try { await b.commit(); localStorage.removeItem('fsh_join'); toast('Household created', 'success'); enterHousehold(ref.id); }
  catch (e) { toast(errMsg(e), 'error'); }
}

async function joinViaInvite(invite) {
  const b = writeBatch(db);
  b.set(doc(db, 'households', invite.householdId, 'members', uid()), memberDoc('member'));
  b.set(doc(db, 'users', uid()), { householdId: invite.householdId, updatedAt: serverTimestamp() });
  b.delete(doc(db, 'invites', S.user.email.toLowerCase()));
  try { await b.commit(); localStorage.removeItem('fsh_join'); toast(`Welcome to ${invite.householdName}!`, 'success'); enterHousehold(invite.householdId); }
  catch (e) { toast(errMsg(e), 'error'); }
}

async function requestAccess(hh) {
  try {
    await setDoc(doc(db, 'households', hh.id, 'requests', uid()),
      { uid: uid(), email: S.user.email, name: S.user.displayName || S.user.email, photo: S.user.photoURL || '', requestedAt: serverTimestamp() });
    screenWaiting(hh);
  } catch (e) { toast(errMsg(e), 'error'); }
}

function screenWaiting(hh) {
  screen(`<div class="logo"><i class="ph-bold ph-hourglass-medium"></i></div>
    <h1>Request sent</h1>
    <p class="lead">We’ve asked <b>${esc(hh.ownerName)}</b> to let you into <b>${esc(hh.name)}</b>. This screen opens the app automatically once they approve — you can close it and come back later.</p>
    <button class="btn block" id="nudge"><i class="ph-bold ph-paper-plane-tilt"></i>Remind ${esc(firstName(hh.ownerName))}</button>
    <button class="btn danger block" style="margin-top:10px" id="cancelReq">Cancel request</button>
    <button class="btn block" style="margin-top:20px;background:none;border:0;color:var(--dim)" id="so">Sign out</button>`);
  const memberRef = doc(db, 'households', hh.id, 'members', uid());
  const reqRef = doc(db, 'households', hh.id, 'requests', uid());
  let done = false;
  const go = async () => {
    if (done) return; done = true;
    S.unsubs.forEach(u => u()); S.unsubs = [];
    await setDoc(doc(db, 'users', uid()), { householdId: hh.id, updatedAt: serverTimestamp() });
    localStorage.removeItem('fsh_join');
    toast('You’re in! Welcome.', 'success');
    enterHousehold(hh.id);
  };
  sub(onSnapshot(memberRef, s => { if (s.exists()) go(); }, () => {}));
  sub(onSnapshot(reqRef, async s => {
    if (s.exists() || s.metadata.fromCache || done) return;
    const m = await getDoc(memberRef).catch(() => null);
    if (m?.exists()) return go();
    S.unsubs.forEach(u => u()); S.unsubs = [];
    localStorage.removeItem('fsh_join');
    screen(`<div class="logo"><i class="ph-bold ph-x"></i></div><h1>Request closed</h1>
      <p class="lead">The request was declined or cancelled. Ask ${esc(hh.ownerName)} to invite your email directly.</p>
      <button class="btn block" id="back">Back</button>`);
    $('#back').onclick = () => screenOnboarding({});
  }, () => {}));
  $('#nudge').onclick = () => shareText('Family Spend Hub', `Hi ${firstName(hh.ownerName)}, I’ve requested to join "${hh.name}" on Family Spend Hub (${S.user.email}). Please approve it in the Family tab.`, appUrl());
  $('#cancelReq').onclick = async () => { await deleteDoc(reqRef).catch(e => toast(errMsg(e), 'error')); };
  $('#so').onclick = () => signOut(auth);
}

/* =====================================================================
   5. INSIDE THE HOUSEHOLD — LIVE DATA
   ===================================================================== */
function enterHousehold(hid) {
  teardown();
  S.hid = hid;
  localStorage.setItem('fsh_hid_' + uid(), hid);
  localStorage.removeItem('fsh_join');
  renderShell();

  sub(onSnapshot(doc(db, 'households', hid), s => {
    S.household = s.exists() ? s.data() : null;
    if (S.household && !S.roleReady) { S.roleReady = true; startRoleListeners(); }
    refresh();
  }, listenErr));

  sub(onSnapshot(doc(db, 'households', hid, 'members', uid()), s => {
    if (!s.exists()) { if (!s.metadata.fromCache) kicked(); return; }
    S.me = s.data(); refresh();
  }, listenErr));

  sub(onSnapshot(collection(db, 'households', hid, 'members'), s => {
    S.members = s.docs.map(d => d.data()).sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : (a.name || '').localeCompare(b.name || '')));
    refresh();
  }, listenErr));

  sub(onSnapshot(collection(db, 'users', uid(), 'cards'), s => {
    S.cards = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    refresh();
  }, listenErr));

  const mine = (coll, key, after) => sub(onSnapshot(collection(db, 'users', uid(), coll), s => {
    S[key] = s.docs.map(d => ({ id: d.id, ...d.data() })); after?.(); refresh();
  }, listenErr));
  mine('savings', 'savings', () => { if (S.savings.some(x => x.type === 'mf')) refreshNavs(); });
  mine('loans', 'loans');
  mine('charges', 'charges');
  sub(onSnapshot(doc(db, 'users', uid(), 'prefs', 'main'), s => { S.prefs = s.exists() ? s.data() : {}; refresh(); }, listenErr));
  sub(onSnapshot(query(collection(db, 'households', hid, 'goldRates'), orderBy('date', 'desc'), limit(120)), s => {
    S.goldHist = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!S.goldBooted) { S.goldBooted = true; loadGold(); } else refresh();
  }, e => { console.warn(e); if (!S.goldBooted) { S.goldBooted = true; loadGold(); } }));

  sub(onSnapshot(collection(db, 'households', hid, 'lists'), s => {
    S.lists = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    syncItemListeners(); refresh();
  }, listenErr));
}

function startRoleListeners() {
  const since = Timestamp.fromDate(monthsAgo(HISTORY_MONTHS));
  const mapExp = d => { const x = d.data(); return { id: d.id, ...x, date: x.date?.toDate ? x.date.toDate() : new Date(), pending: d.metadata.hasPendingWrites }; };
  if (isOwner()) {
    sub(onSnapshot(query(expCol(), where('date', '>=', since), orderBy('date', 'desc')), { includeMetadataChanges: true }, s => {
      S.family = s.docs.map(mapExp);
      S.expenses = S.family.filter(e => e.uid === uid());
      refresh();
    }, listenErr));
    sub(onSnapshot(collection(db, 'households', S.hid, 'requests'), s => {
      S.requests = s.docs.map(d => d.data()); refresh();
    }, listenErr));
    sub(onSnapshot(query(collection(db, 'invites'), where('ownerUid', '==', uid())), s => {
      S.invites = s.docs.map(d => d.data()); refresh();
    }, listenErr));
  } else {
    sub(onSnapshot(query(expCol(), where('uid', '==', uid()), where('date', '>=', since), orderBy('date', 'desc')), { includeMetadataChanges: true }, s => {
      S.expenses = s.docs.map(mapExp); refresh();
    }, listenErr));
  }
}

function syncItemListeners() {
  const ids = new Set(S.lists.map(l => l.id));
  for (const id of Object.keys(S.itemUnsubs)) if (!ids.has(id)) { S.itemUnsubs[id](); delete S.itemUnsubs[id]; delete S.items[id]; }
  for (const id of ids) if (!S.itemUnsubs[id]) {
    S.itemUnsubs[id] = onSnapshot(collection(db, 'households', S.hid, 'lists', id, 'items'), { includeMetadataChanges: true }, s => {
      S.items[id] = s.docs.map(d => ({ id: d.id, ...d.data(), pending: d.metadata.hasPendingWrites }));
      refresh();
    }, listenErr);
  }
}

function listenErr(e) {
  console.error(e);
  if (e.code === 'failed-precondition' && /index/i.test(e.message)) {
    const link = (e.message.match(/https:\/\/console\.firebase\.google\.com\S+/) || [])[0];
    S.indexError = link || true; refresh(); return;
  }
  if (e.code === 'permission-denied') return; // handled by membership listener
  toast(errMsg(e), 'error');
}

async function kicked() {
  teardown();
  await setDoc(doc(db, 'users', uid()), { householdId: null, updatedAt: serverTimestamp() }).catch(() => {});
  localStorage.removeItem('fsh_hid_' + uid());
  screenOnboarding({ removed: true });
}

function renderShell() {
  appEl.innerHTML = `
    <header class="topbar"><div class="topbar-inner">
      <div class="logo"><i class="ph-bold ph-wallet"></i></div>
      <div class="top-title"><small id="hhLabel">Family Spend Hub</small><h1 id="viewTitle">Home</h1></div>

    </div></header>
    <div class="body">
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <main><div class="content" id="view"></div></main>
    </div>
    <button class="fab hidden" id="fab"></button>`;
  $('#topAvatar').onclick = openMore;
  updateNet();
  renderNav();
  route();
}
function renderNav() {
  const nav = $('#nav'); if (!nav) return;
  const v = S.view;
  const desk = v === 'list' ? 'lists' : v === 'member' ? 'family' : v === 'gold' ? 'money' : v;
  const mob = ['settings', 'activity', 'family', 'member', 'bybank'].includes(v) ? 'more' : desk;
  const reqs = isOwner() ? S.requests.length : 0;
  nav.innerHTML = navItems().map(it => {
    const act = (it.where !== 'mob' && desk === it.id) || (it.where !== 'desk' && mob === it.id);
    const cls = `${it.where === 'desk' ? 'desk' : it.where === 'mob' ? 'mob' : ''} ${act ? 'active' : ''}`;
    const badge = (it.id === 'family' || it.id === 'more') && reqs ? `<span class="badge">${reqs}</span>` : '';
    const inner = `<span class="pill"><i class="ph${act ? '-fill' : '-bold'} ph-${it.icon}"></i></span><span class="lbl">${it.label}</span>${badge}`;
    return it.id === 'more'
      ? `<button type="button" class="${cls}" data-more aria-label="More${reqs ? `, ${reqs} access requests` : ''}">${inner}</button>`
      : `<a href="#${it.id}" class="${cls}" ${act ? 'aria-current="page"' : ''}>${inner}</a>`;
  }).join('');
  nav.querySelector('[data-more]')?.addEventListener('click', openMore);
  updateFab();
}
function updateFab() {
  const f = $('#fab'); if (!f) return;
  let mode = null;
  const v = S.view;
  if (v === 'list') {
    const got = (S.items[S.viewArg] || []).filter(i => i.status === 'got').length;
    if (got) mode = { cls: 'finish', html: `<i class="ph-bold ph-flag-checkered"></i>Finish trip · ${got}`, go: () => finishTrip(S.viewArg) };
  } else if (v === 'money') {
    mode = S.viewArg === 'loans'
      ? { cls: 'pay', html: '<i class="ph-bold ph-check"></i>Record payment', go: () => payPicker('loans') }
      : { cls: 'pay', html: '<i class="ph-bold ph-check"></i>Mark paid', go: () => payPicker('savings') };
  } else if (['home', 'lists', 'activity', 'family', 'member', 'bybank'].includes(v)) {
    mode = { cls: 'log', html: '<i class="ph-bold ph-plus"></i>Log', go: () => { location.hash = '#add'; } };
  }
  if (!mode) { f.className = 'fab hidden'; return; }
  f.className = `fab ${mode.cls}`;
  if (f.dataset.html !== mode.html) { f.innerHTML = mode.html; f.dataset.html = mode.html; }
  f.onclick = mode.go;
}
function openMore() {
  const owner = isOwner(), reqs = owner ? S.requests.length : 0;
  const row = (icon, label, attrs, extra = '', color = '') => `<button type="button" class="more-row" ${attrs}><i class="ph-bold ph-${icon} lead" ${color ? `style="color:${color}"` : ''}></i><span class="grow">${label}</span>${extra}<i class="ph-bold ph-caret-right muted"></i></button>`;
  openSheet(`<div class="row" style="padding:0 4px 14px;border-bottom:1px solid var(--line)">${avatar({ name: myName(), photo: S.user.photoURL }, 'lg')}
      <span class="grow"><b style="font-size:16px">${esc(myName())}</b><span class="small muted" style="display:block">${owner ? 'Owner' : 'Member'}${S.household ? ' · ' + esc(S.household.name) : ''}</span></span></div>
    <nav aria-label="More" class="stack" style="gap:2px;margin-top:10px">
      ${owner ? row('users-three', 'Family dashboard', 'data-go="#family"', reqs ? `<span class="tag red">${reqs} waiting</span>` : '') : ''}
      ${row('chart-bar-horizontal', 'Money out by bank', 'data-go="#bybank"')}
      ${row('receipt', 'My activity', 'data-go="#activity"')}
      ${row('credit-card', 'Credit cards &amp; bills', 'data-go="#settings/cards"', '', '#f4a7d3')}
      ${row('gear-six', 'Settings', 'data-go="#settings"')}
      ${row('download-simple', 'Export my expenses (CSV)', 'data-export')}
      <button type="button" class="more-row" data-signout style="color:var(--error)"><i class="ph-bold ph-sign-out lead" style="color:var(--error)"></i><span class="grow">Sign out</span></button>
    </nav>
    <div class="actions"><button class="btn" data-close>Close</button></div>`, el => {
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const h = b.dataset.go; closeSheet(); if (location.hash === h) route(); else location.hash = h; });
    el.querySelector('[data-export]').onclick = () => { closeSheet(); downloadCSV(S.expenses, 'my_expenses'); };
    el.querySelector('[data-signout]').onclick = async () => { closeSheet(); if (await ask('Sign out?', 'You can sign back in any time with Google.', 'Sign out')) signOut(auth); };
    el.querySelector('[data-close]').onclick = closeSheet;
  });
}
function updateNet() {
  const n = $('#net'); if (!n) return;
  n.classList.toggle('off', !navigator.onLine);
  n.querySelector('.lbl').textContent = navigator.onLine ? 'Online' : 'Offline';
}
addEventListener('online', updateNet);
addEventListener('offline', updateNet);

let refreshQueued = false;
function refresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => {
    refreshQueued = false;
    if (!S.hid || !$('#view')) return;
    const hl = $('#hhLabel'); if (hl && S.household) hl.textContent = S.household.name;
    renderNav();
    if ((S.view === 'family' || S.view === 'member') && S.household && !isOwner()) { location.hash = '#home'; return; }
    if (S.household && S.mountedOwner !== isOwner()) return route();
    VIEWS[S.view]?.update?.(S.viewArg);
  });
}

function route() {
  if (!S.hid || !$('#view')) return;
  const [name, ...rest] = (location.hash.slice(1) || 'home').split('/');
  const arg = rest.length ? decodeURIComponent(rest.join('/')) : null;
  const view = VIEWS[name] ? name : 'home';
  if ((view === 'family' || view === 'member') && S.household && !isOwner()) { location.replace('#home'); return; }
  destroyCharts();
  closeSheet();
  S.view = view; S.viewArg = arg; S.mountedOwner = isOwner();
  $('#view').innerHTML = '';
  VIEWS[view].mount($('#view'), arg);
  $('#viewTitle').textContent = VIEWS[view].title(arg);
  renderNav();
  VIEWS[view].update?.(arg);
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

function indexBanner() {
  if (!S.indexError) return '';
  const link = typeof S.indexError === 'string' ? `<a href="${esc(S.indexError)}" target="_blank" rel="noopener">Create it in one click</a>` : 'See the setup guide, Part 2.';
  return `<div class="notice err">One Firestore index is still missing, so members’ expenses can’t load yet. ${link} (takes about 2 minutes to build).</div>`;
}

    let category = cat;
    let bank = e?.bank || S.prefs?.lastBank || '';
    const fillBanks = () => {
      const show = BANK_MODES.includes($('#fMode').value);
      $('#fBankRow').classList.toggle('hidden', !show);

      if (!bank && banks().includes(S.prefs?.lastBank)) bank = S.prefs.lastBank;
      $('#fBanks').innerHTML = [...banks(), ...(bank && !banks().includes(bank) ? [bank] : [])].map(b => `<button type="button" class="bank-chip ${b === bank ? 'on' : ''}" data-bank="${esc(b)}" aria-pressed="${b === bank}">${esc(b)}</button>`).join('');

    };
    const updateSaveLabel = () => {
      const btn = $('#expSave'); if (!btn) return;
      const amt = num($('#fAmt').value), m = $('#fMode').value;
      const card = m === 'Credit card' ? S.cards.find(c => c.id === $('#fCard').value) : null;
      const from = BANK_MODES.includes(m) ? bank : card ? (card.bank || card.name) : '';
      btn.innerHTML = `<i class="ph-bold ph-check"></i>${e ? 'Save changes' : amt ? `Save ${inr(amt)}${from ? ' from ' + esc(from) : ''}` : 'Save expense'}`;
    };

    $('#fAddBank').onclick = () => addBankPrompt(v => { bank = v; fillBanks(); });
    $('#fAmt').addEventListener('input', () => updateSaveLabel());
    const fillCards = () => {
      const isCC = $('#fMode').value === 'Credit card';
      $('#fCardRow').classList.toggle('hidden', !isCC);
      if (!isCC) return;
      const keep = $('#fCard').value || e?.cardId || localStorage.getItem('fsh_lastCard') || '';
      $('#fCard').innerHTML = S.cards.map(c => `<option value="${esc(c.id)}" ${c.id === keep ? 'selected' : ''}>${esc(cardTitle(c))}</option>`).join('')
        + `<option value="__new">+ Add a credit card…</option>`;
      if (!S.cards.length) $('#fCard').value = '__new';
      $('#fCardHint').textContent = S.cards.length ? 'Counts towards that card’s next bill.' : 'Add your card once to track its bill and due date.';
    };

    $('#fCard').onchange = () => { if ($('#fCard').value === '__new') cardSheet(null, () => setTimeout(fillCards, 300)); updateSaveLabel(); };
    fillCards(); fillBanks(); updateSaveLabel();

      const inp = $('#fAmt'); const v = Number(b.dataset.add);
      inp.value = v ? (Number(inp.value || 0) + v) : ''; inp.focus();
    });
    el.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      category = b.dataset.cat;
      el.querySelectorAll('[data-cat]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
    });
    $('#expForm').onsubmit = ev => {
      ev.preventDefault();
      const amount = Math.round(parseFloat($('#fAmt').value) * 100) / 100;
      if (!amount || amount <= 0) { toast('Enter an amount', 'warning'); $('#fAmt').focus(); return; }
      const [y, m, d] = $('#fDate').value.split('-').map(Number);
      const now = new Date();
      const when = $('#fDate').value ? new Date(y, m - 1, d, now.getHours(), now.getMinutes()) : now;
      const data = {
        uid: uid(), memberName: myName(), amount, category, merchant: $('#fMer').value.trim() || category,
        mode: $('#fMode').value, date: Timestamp.fromDate(e && localISO(e.date) === $('#fDate').value ? e.date : when),
        createdAt: serverTimestamp(), source: 'manual'
      };
      if (data.mode === 'Credit card') {
        const card = S.cards.find(c => c.id === $('#fCard').value);
        if (!card) { toast('Pick a credit card, or add one first', 'warning'); return; }
        data.cardId = card.id; data.cardName = cardTitle(card);
        if (card.bank) data.bank = card.bank;
        localStorage.setItem('fsh_lastCard', card.id);
      }
      if (BANK_MODES.includes(data.mode)) {
        if (!bank) { toast('Choose which bank it was paid from', 'warning'); return; }
        data.bank = bank;
        if (S.prefs?.lastBank !== bank) savePrefs({ lastBank: bank });
      }
      localStorage.setItem('fsh_lastCat', category); localStorage.setItem('fsh_lastMode', data.mode);
      const p = e ? setDoc(doc(expCol(), e.id), data) : addDoc(expCol(), data);
      p.catch(err => toast('Not saved: ' + errMsg(err), 'error'));
      toast(navigator.onLine ? `Saved ${inr(amount)}` : `Saved ${inr(amount)} offline — will sync`, 'success');
      location.hash = e ? '#activity' : '#home';
    };

  }
};

function attachSwipe(container, listId) {
  let start = null, face = null, dx = 0, moved = false;
  const find = id => (S.items[listId] || []).find(i => i.id === id);
  container.addEventListener('pointerdown', e => {
    const f = e.target.closest('.face'); if (!f || e.target.closest('[data-toggle]')) return;
    start = { x: e.clientX, y: e.clientY }; face = f; dx = 0; moved = false; face.style.transition = 'none';
  });
  container.addEventListener('pointermove', e => {
    if (!start) return;
    const ddx = e.clientX - start.x, ddy = e.clientY - start.y;
    if (!moved && Math.abs(ddy) > Math.abs(ddx) && Math.abs(ddy) > 8) { start = null; face.style.transform = ''; return; }
    if (Math.abs(ddx) > 8) moved = true;
    if (moved) { dx = Math.max(-140, Math.min(140, ddx)); face.style.transform = `translateX(${dx}px)`; }
  });
  const end = () => {
    if (!start || !face) { start = null; return; }
    face.style.transition = ''; face.style.transform = '';
    const id = face.closest('[data-item]').dataset.item, item = find(id);
    if (item && moved && dx > 90) setItem(listId, item, { status: 'got' });
    if (item && moved && dx < -90) { setItem(listId, item, { status: 'na' }); toast(`${item.name}: marked not available. Tap it to add where.`, 'info'); }
    if (moved) { const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; container.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => container.removeEventListener('click', stop, { capture: true }), 50); }
    start = null; face = null;
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('click', e => {
    const row = e.target.closest('[data-item]'); if (!row) return;
    const item = find(row.dataset.item); if (!item) return;
    if (e.target.closest('[data-toggle]')) return setItem(listId, item, { status: item.status === 'got' ? 'tobuy' : 'got' });
    if (e.target.closest('[data-open]')) itemSheet(listId, item);
  });
}

      }
      closeSheet();
      toast(amt > 0 ? `Trip done · ${inr(amt)} logged` : 'Trip done', 'success');
    };

}

async function onAccessClick(e) {
  const t = e.target.closest('[data-approve],[data-deny],[data-remove],[data-revoke],[data-resend]'); if (!t) return;
  e.preventDefault();
  if (t.dataset.approve) {
    const r = S.requests.find(x => x.uid === t.dataset.approve); if (!r) return;
    const b = writeBatch(db);
    b.set(doc(db, 'households', S.hid, 'members', r.uid), { uid: r.uid, email: r.email, name: r.name, photo: r.photo || '', role: 'member', joinedAt: serverTimestamp() });
    b.delete(doc(db, 'households', S.hid, 'requests', r.uid));
    b.commit().then(() => toast(`${r.name} can now use the app`, 'success')).catch(err => toast(errMsg(err), 'error'));
  } else if (t.dataset.deny) {
    const r = S.requests.find(x => x.uid === t.dataset.deny);
    if (await ask('Decline request?', `${esc(r?.name)} won’t get access. They can request again later.`, 'Decline', true))
      deleteDoc(doc(db, 'households', S.hid, 'requests', t.dataset.deny)).catch(err => toast(errMsg(err), 'error'));
  } else if (t.dataset.remove) {
    const m = S.members.find(x => x.uid === t.dataset.remove);
    if (await ask(`Remove ${m?.name}?`, 'They lose access immediately. Expenses they already logged stay visible to you in the family dashboard.', 'Remove', true))
      deleteDoc(doc(db, 'households', S.hid, 'members', t.dataset.remove)).then(() => toast('Removed', 'info')).catch(err => toast(errMsg(err), 'error'));
  } else if (t.dataset.revoke) {
    deleteDoc(doc(db, 'invites', t.dataset.revoke)).then(() => toast('Invite revoked', 'info')).catch(err => toast(errMsg(err), 'error'));
  } else if (t.dataset.resend) {
    inviteMessage(t.dataset.resend);
  }
}
function inviteMessage(email) {
  shareText(`Join ${S.household?.name}`, `I’ve added you to "${S.household?.name}" on Family Spend Hub. Open the link and sign in with ${email}.`, appUrl());
}
async function inviteEmail(raw) {
  const email = String(raw || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email address', 'warning');
  if (S.members.find(m => (m.email || '').toLowerCase() === email)) return toast('They’re already a member', 'info');
  try {
    await setDoc(doc(db, 'invites', email), { email, householdId: S.hid, householdName: S.household.name, ownerUid: uid(), ownerName: myName(), invitedAt: serverTimestamp() });
    $('#invEmail').value = '';
    toast(`Invited ${email}`, 'success');
    inviteMessage(email);
  } catch (e) {
    toast(e.code === 'permission-denied' ? 'That email already has a pending invite (maybe from another household).' : errMsg(e), 'error');
  }
}

      el.querySelector('[data-go]').disabled = true;
      try {
        if (del) {
          const snap = await getDocs(query(expCol(), where('uid', '==', uid())));
          for (let i = 0; i < snap.docs.length; i += 400) {
            const b = writeBatch(db); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit();
          }
        }
        const b = writeBatch(db);
        b.delete(doc(db, 'households', S.hid, 'members', uid()));
        b.set(doc(db, 'users', uid()), { householdId: null, updatedAt: serverTimestamp() });
        await b.commit();
        localStorage.removeItem('fsh_hid_' + uid());
        sheetResolve = null; closeSheet(); teardown(); screenOnboarding({});
      } catch (e) { toast(errMsg(e), 'error'); el.querySelector('[data-go]').disabled = false; }
    };
  });
}

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseDateLoose(s) {
  s = String(s || '').trim(); if (!s) return null;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    let [, a, b, y, hh = 12, mm = 0] = m; a = +a; b = +b;
    const [day, mon] = b > 12 ? [b, a] : [a, b]; // Indian day/month order unless impossible
    return new Date(+y, mon - 1, day, +hh, +mm);
  }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function normCategory(c) {
  const hit = CATEGORIES.find(x => x.id.toLowerCase() === String(c || '').trim().toLowerCase());
  return hit ? hit.id : 'Other';
}
function normMode(t) {
  t = String(t || '').toLowerCase();
  if (t.includes('cash') || t.includes('offline')) return 'Cash';
  if (t.includes('credit')) return 'Credit card';
  if (t.includes('card') || t.includes('pos')) return 'Debit card';
  if (t.includes('upi')) return 'UPI';
  return 'Bank transfer';
}
async function importCSV(file) {
  const rows = parseCSV((await file.text()).replace(/^\ufeff/, ''));
  if (rows.length < 2) return toast('That file has no rows', 'warning');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = names => head.findIndex(h => names.some(n => h === n || h.startsWith(n)));
  const ci = { date: col(['date']), amount: col(['amount']), cat: col(['category']), mer: col(['merchant', 'note', 'description']), mode: col(['mode', 'type']), id: col(['txn id', 'id']) };
  if (ci.date < 0 || ci.amount < 0) return toast('Need at least Date and Amount columns', 'warning');
  const out = [];
  for (const r of rows.slice(1)) {
    const amount = parseFloat(String(r[ci.amount] || '').replace(/[₹,\s]/g, ''));
    const date = parseDateLoose(r[ci.date]);
    if (!amount || amount <= 0 || !date) continue;
    const merchant = (ci.mer >= 0 ? r[ci.mer] : '').trim().slice(0, 120);
    const rawId = ci.id >= 0 ? r[ci.id] : '';
    const key = (rawId || `${date.getTime()}_${amount}_${merchant}`).replace(/[^A-Za-z0-9_\-]/g, '').slice(0, 100);
    out.push({ id: 'imp_' + key, data: { uid: uid(), memberName: myName(), amount: Math.round(amount * 100) / 100, category: ci.cat >= 0 ? normCategory(r[ci.cat]) : 'Other',
      merchant: merchant || 'Imported', mode: ci.mode >= 0 ? normMode(r[ci.mode]) : 'Bank', date: Timestamp.fromDate(date), createdAt: serverTimestamp(), source: 'import' } });
  }
  if (!out.length) return toast('No valid rows found', 'warning');
  if (!(await ask(`Import ${out.length} expenses?`, `They’ll be added as your expenses. Rows older than ${HISTORY_MONTHS} months are stored but not shown on dashboards.`, 'Import'))) return;
  try {
    for (let i = 0; i < out.length; i += 400) {
      const b = writeBatch(db);
      out.slice(i, i + 400).forEach(x => b.set(doc(expCol(), x.id), x.data));
      await b.commit();
    }
    toast(`Imported ${out.length} expenses`, 'success');
  } catch (e) { toast('Import failed: ' + errMsg(e), 'error'); }
}

   7b. CREDIT CARDS — bill cycle, due date, reminders, calendar export
   ===================================================================== */
const cardTitle = c => c.last4 ? `${c.name} ··${c.last4}` : c.name;
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const onDay = (y, m, d) => { const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return new Date(yy, mm, Math.min(d, daysIn(yy, mm))); };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const eod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
const fmtDay = d => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

function cardCycle(card, now = new Date()) {
  const today = sod(now);
  let lastSt = onDay(now.getFullYear(), now.getMonth(), card.statementDay);
  if (lastSt > today) lastSt = onDay(now.getFullYear(), now.getMonth() - 1, card.statementDay);
  const prevSt = onDay(lastSt.getFullYear(), lastSt.getMonth() - 1, card.statementDay);
  const nextSt = onDay(lastSt.getFullYear(), lastSt.getMonth() + 1, card.statementDay);
  let due = onDay(lastSt.getFullYear(), lastSt.getMonth(), card.dueDay);
  if (due <= lastSt) due = onDay(lastSt.getFullYear(), lastSt.getMonth() + 1, card.dueDay);
  const mine = S.expenses.filter(e => e.cardId === card.id);
  const sum = (from, to) => mine.filter(e => e.date > from && e.date <= to).reduce((s, e) => s + Number(e.amount || 0), 0);
  const billed = sum(eod(prevSt), eod(lastSt));
  const unbilled = sum(eod(lastSt), now);
  const key = localISO(lastSt);
  const paid = card.paidFor === key;
  const daysLeft = Math.round((sod(due) - today) / 86400000);
  let status, tone;
  if (paid) { status = 'Paid'; tone = 'ok'; }
  else if (!billed) { status = 'No bill this cycle'; tone = 'blue'; }
  else if (daysLeft < 0) { status = `Overdue by ${-daysLeft} day${daysLeft === -1 ? '' : 's'}`; tone = 'red'; }
  else if (daysLeft === 0) { status = 'Due today'; tone = 'red'; }
  else { status = `Due in ${daysLeft} day${daysLeft === 1 ? '' : 's'}`; tone = daysLeft <= (card.remindDays ?? 3) ? '' : 'blue'; }
  return { lastSt, prevSt, nextSt, due, billed, unbilled, key, paid, daysLeft, status, tone, isStatementDay: sod(lastSt).getTime() === today.getTime() };
}

/* calendar: monthly all-day event on the due date with alarms */
function rruleFor(day) {
  return day <= 28 ? `FREQ=MONTHLY;BYMONTHDAY=${day}` : `FREQ=MONTHLY;BYMONTHDAY=${Array.from({ length: day - 27 }, (_, i) => 28 + i).join(',')};BYSETPOS=-1`;
}
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
function nextDue(card) { const t = sod(new Date()); let d = onDay(t.getFullYear(), t.getMonth(), card.dueDay); if (d < t) d = onDay(t.getFullYear(), t.getMonth() + 1, card.dueDay); return d; }
function downloadICS(card) {
  const start = nextDue(card), end = new Date(start); end.setDate(end.getDate() + 1);
  const n = card.remindDays ?? 3;
  const early = n > 0 ? `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${card.name} bill due in ${n} day(s)\r\nTRIGGER:-P${n - 1}DT14H\r\nEND:VALARM\r\n` : '';
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Family Spend Hub//EN\r\nCALSCALE:GREGORIAN\r\nBEGIN:VEVENT\r\nUID:fsh-due-${card.id}@familyspendhub\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}\r\n`
    + `DTSTART;VALUE=DATE:${ymd(start)}\r\nDTEND;VALUE=DATE:${ymd(end)}\r\nRRULE:${rruleFor(card.dueDay)}\r\nSUMMARY:Pay ${cardTitle(card)} credit card bill\r\n`
    + `DESCRIPTION:Bill is generated on the ${ordinal(card.statementDay)}. Check the amount in Family Spend Hub.\r\nTRANSP:TRANSPARENT\r\n${early}`
    + `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${card.name} bill due today\r\nTRIGGER:PT9H\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${card.name.replace(/[^A-Za-z0-9]+/g, '_')}_bill_due.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Open the downloaded file to add it to your calendar', 'success');
}
function googleCalUrl(card) {
